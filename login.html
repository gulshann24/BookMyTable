<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — L'Gran</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Overpass:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary:    #ffc901;
            --bg-dark:    #1a1a1a;
            --bg-card:    #2a2a2a;
            --bg-input:   #333333;
            --text-main:  #f0ede8;
            --text-muted: #a8a39c;
            --border:     rgba(240, 237, 232, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Overpass', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255,201,1,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255,201,1,0.04) 0%, transparent 50%);
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 36px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Overpass', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.04em;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000;
        }

        /* ── Form panels ── */
        .panel { display: none; }
        .panel.active { display: block; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Overpass', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }

        .input-wrap input:focus {
            border-color: var(--primary);
        }

        .input-wrap input::placeholder {
            color: var(--text-muted);
        }

        /* password toggle */
        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            padding: 0;
            line-height: 1;
        }

        .toggle-pass:hover { color: var(--primary); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #000;
            font-family: 'Overpass', sans-serif;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.08em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s, opacity 0.3s;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .btn-submit:hover    { background: #c19b2e; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .msg {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .msg.error   { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.4); color: #ff6b6b; }
        .msg.success { background: rgba(40,167,69,0.15);  border: 1px solid rgba(40,167,69,0.4);  color: #69db7c; }
        .msg.show    { display: block; }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .back-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover { text-decoration: underline; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        @media (max-width: 480px) {
            .card { padding: 24px; }
        }
    </style>
</head>

<body>

    <div class="brand">L'Gran</div>
    <div class="brand-sub">Restaurant &amp; Dining</div>

    <div class="card">

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-login"    onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn"        id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <!-- ── LOGIN PANEL ── -->
        <div class="panel active" id="panel-login">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrap">
                    <i class="bx bx-envelope"></i>
                    <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="bx bx-lock-alt"></i>
                    <input type="password" id="login-password" placeholder="Your password" autocomplete="current-password">
                    <button class="toggle-pass" onclick="togglePass('login-password', this)" tabindex="-1">
                        <i class="bx bx-hide"></i>
                    </button>
                </div>
            </div>

            <button class="btn-submit" id="login-btn" onclick="handleLogin()">Sign In</button>
            <div class="msg" id="login-msg"></div>
        </div>

        <!-- ── REGISTER PANEL ── -->
        <div class="panel" id="panel-register">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <i class="bx bx-user"></i>
                    <input type="text" id="reg-username" placeholder="yourname" autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrap">
                    <i class="bx bx-envelope"></i>
                    <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label>Password <span style="font-size:11px;color:var(--text-muted)">(min. 6 chars)</span></label>
                <div class="input-wrap">
                    <i class="bx bx-lock-alt"></i>
                    <input type="password" id="reg-password" placeholder="Create a password" autocomplete="new-password">
                    <button class="toggle-pass" onclick="togglePass('reg-password', this)" tabindex="-1">
                        <i class="bx bx-hide"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrap">
                    <i class="bx bx-lock-open-alt"></i>
                    <input type="password" id="reg-confirm" placeholder="Repeat password" autocomplete="new-password">
                </div>
            </div>

            <button class="btn-submit" id="reg-btn" onclick="handleRegister()">Create Account</button>
            <div class="msg" id="reg-msg"></div>
        </div>

    </div>

    <div class="back-link">
        <a href="index.html"><i class="bx bx-arrow-back"></i> Back to L'Gran</a>
    </div>

    <script src="login.js"></script>
</body>

</html>
